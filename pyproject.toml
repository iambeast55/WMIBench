[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
# Keep the distribution ID so pip upgrades existing installs in place.
name = "remoteops"
version = "0.2.0"
description = "WMIBench: Windows administration over persistent WMI/DCOM and WinRM sessions."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "WMIBench" }
]
dependencies = [
  "PySide6>=6.7",
  "QtAwesome>=1.3,<2",
  "keyring>=25.0",
  "cryptography>=43",
  "pypsrp>=0.9.1,<0.10",
  "pywin32>=308; sys_platform == 'win32'",
  "pyspnego>=0.12.2,<0.13",
  "impacket==0.13.1",
  "minikerberos==0.4.9",
  "asyauth==0.0.23",
  "asysocks==0.2.18",
  "unicrypto==0.0.12",
  "asn1crypto==1.5.1",
  "oscrypto==1.3.0",
  "dnspython>=2.6,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6"
]

[project.scripts]
wmibench = "remoteops.__main__:main"
remoteops = "remoteops.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/remoteops", "src/wmibench"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
